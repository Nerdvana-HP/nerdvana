intro:
  eyebrow: STEM implementation for schools and districts
  heading: Bring hands-on STEM learning to life.
  body: >
    Nerdvana partners with schools, districts, and workforce organizations to
    plan and deliver STEM enrichment, engineering residencies, and
    workforce-readiness programming.


    We help **turn institutional goals into structured programs and hands-on
    learning** students can experience.
  primaryAction:
