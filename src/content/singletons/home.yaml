story:
  eyebrow: Programs Built Around Partnership
  heading: Four Offerings. A Range of STEM Experiences.
  body: >
    From robotics and drone automation to aerospace, forensic science,
    engineering design, smart wearables, and more, students tackle hands-on
    challenges by **designing, building, testing, and improving solutions**.
    Technology isn’t the goal; it’s a tool for solving real engineering
    problems.
