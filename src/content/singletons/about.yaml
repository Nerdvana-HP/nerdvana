seo:
  title: About Nerdvana | STEM Partnerships for Schools
  description: >-
    Learn how Nerdvana STEM Education partners with schools, districts, and
    workforce organizations to deliver hands-on STEM and career-connected
    learning.
hero:
  eyebrow: About Nerdvana
  heading: Making meaningful STEM learning work for schools and students.
  lede: >-
    For 10 years, Nerdvana has partnered with schools, districts, and
    organizations to bring hands-on STEM learning to students. We help our
    partners plan and deliver programs that fit their goals, setting, and
    learners.
  primaryAction:
    label: Plan a partnership
    href: /contact/
  secondaryAction:
    label: Explore Our Partnerships
    href: /#carousel-106
  image:
    src: /images/singletons/about/hero/image/src.jpg
    alt: Engineering Residency Planning
story:
  heading: Experience built through partnership
  body: >
    Nerdvana has reached **more than 50,000 K–12 students across Texas and
    India** and worked with 25+ school districts, nonprofits, and government
    organizations across Texas. Our partnerships include after-school and summer
    STEM programs, engineering residencies, and workforce-readiness programming.
